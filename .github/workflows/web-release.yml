name: Build and Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build static site
        working-directory: web
        env:
          VITE_BASE: /
        run: bun run build
      - name: Package website
        working-directory: web/dist
        run: zip -r ../../jisu-canvas-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: jisu-canvas-web
          path: jisu-canvas-web.zip
          if-no-files-found: error

  plugins:
    needs: build
    uses: ./.github/workflows/publish-plugins.yml

  docker:
    needs: [build, plugins]
    uses: ./.github/workflows/docker-image.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jisu-canvas-web
      - name: Publish release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" jisu-canvas-web.zip --clobber
          else
            gh release create "$RELEASE_TAG" jisu-canvas-web.zip --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
